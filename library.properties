sentence=ESP32 hardware abstraction layer for ogr-node-core (OpenGardenRack node/I2C-slave library), on Arduino's Wire.
paragraph=Implements the I2C-slave transport and EN_IN/EN_OUT GPIO for ESP32/ESP32-S3/ESP32-C3 acting as an OGR Node, on top of Arduino's Wire library. Sibling package to ogr-node-hal-esp32 (ESP-IDF native driver/i2c_slave.h) — see README for why both exist. Requires ogr-node-core to be installed alongside it.
